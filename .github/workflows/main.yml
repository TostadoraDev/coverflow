name: Refresh music gallery

on:
  workflow_dispatch:
  push:
    paths:
      - 'albums.json'
      - 'scripts/update_music.py'
      - '.github/workflows/music-gallery.yml'
  schedule:
    - cron: '17 8 * * 0'  # Every Sunday, UTC

permissions:
  contents: write

jobs:
  music-gallery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch album artwork and refresh README
        run: python scripts/update_music.py
      - name: Commit changes only when needed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh album gallery"
          git push
